<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordinal Numbers – Grade 1</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF6FD;--card:#fff;--ink:#1F2A44;--mute:#5b6b8c;--sun:#FFC93C;--coral:#FF6B6B;--leaf:#2FA866;--track:#CDEBB9;--line:#bfd9ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15213a;--card:#1f2e50;--ink:#f4f7ff;--mute:#a9b7d6;--track:#2c5a45;--line:#34466f}}
:root[data-theme="dark"]{--bg:#15213a;--card:#1f2e50;--ink:#f4f7ff;--mute:#a9b7d6;--track:#2c5a45;--line:#34466f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(2rem,8vw,3.2rem);margin:8px 0 4px;line-height:1.1}
h2{font-size:1.4rem;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px;font-size:1.1rem}
section{background:var(--card);border-radius:24px;padding:20px 16px;margin-bottom:20px;border:2px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
/* big card */
#big{text-align:center;background:var(--sun);color:#1F2A44;border-radius:20px;padding:16px;margin-bottom:16px}
#big .pic{font-size:4.5rem;line-height:1}
#big .num{font-size:clamp(3.5rem,18vw,6rem);font-weight:700;line-height:1}
#big .word{font-size:2rem;font-weight:600}
#big .sent{font-size:1.15rem;margin:6px 0 10px}
#say{background:#1F2A44;color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:1.1rem;font-weight:600}
#big.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
/* track */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:var(--track);border-radius:18px;padding:12px 8px}
.runner{background:var(--card);border:3px solid transparent;border-radius:16px;padding:6px 2px 8px;text-align:center}
.runner .a{font-size:clamp(1.8rem,9vw,2.8rem);display:block;line-height:1.2}
.runner .o{font-weight:700;font-size:1.05rem}
.runner[aria-pressed="true"]{border-color:var(--coral)}
.finish{height:10px;margin-top:10px;border-radius:5px;background:repeating-linear-gradient(90deg,#1F2A44 0 14px,#fff 14px 28px)}
.hint{color:var(--mute);margin:10px 0 0;font-size:1rem}
/* table */
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rows div{display:flex;justify-content:space-between;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:1.1rem}
.rows b{color:var(--coral)}
/* quiz */
#prompt{font-size:1.5rem;font-weight:600;margin:0 0 12px;text-align:center}
#qarea{display:grid;gap:8px}
#qarea.line{grid-template-columns:repeat(5,1fr)}
#qarea.words{grid-template-columns:1fr}
.opt{background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:10px 4px;font-size:1.6rem;min-height:56px}
.words .opt{font-size:1.6rem;font-weight:600}
.opt.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.opt.no{background:var(--coral);border-color:var(--coral);color:#fff}
#msg{min-height:1.8em;text-align:center;font-size:1.3rem;font-weight:600;margin:12px 0 0}
#score{display:flex;justify-content:space-between;color:var(--mute);margin-bottom:8px}
.again{background:var(--leaf);color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:1.2rem;font-weight:600}
.end{text-align:center}
.end .stars{font-size:2.6rem}
@media (prefers-reduced-motion:reduce){#big.pop{animation:none}}
@media (max-width:420px){.rows{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Ordinal Numbers</h1>
  <p class="sub">Who finished the race? Tap an animal to learn its place.</p>

  <section aria-labelledby="h-race">
    <h2 id="h-race">The race</h2>
    <div id="big" aria-live="polite"></div>
    <div class="track" id="track"></div>
    <div class="finish" aria-hidden="true"></div>
    <p class="hint">Ordinal numbers tell us the order: 1st, 2nd, 3rd…</p>
  </section>

  <section aria-labelledby="h-list">
    <h2 id="h-list">Numbers and words</h2>
    <div class="rows" id="rows"></div>
  </section>

  <section aria-labelledby="h-quiz">
    <h2 id="h-quiz">Quiz time</h2>
    <div id="score"><span id="round"></span><span id="pts"></span></div>
    <p id="prompt"></p>
    <div id="qarea"></div>
    <p id="msg" aria-live="polite"></p>
  </section>
</main>

<script>
var ANIMALS=[["🐢","turtle"],["🐰","rabbit"],["🦊","fox"],["🐻","bear"],["🐼","panda"],["🐸","frog"],["🐵","monkey"],["🦁","lion"],["🐯","tiger"],["🐶","dog"]];
var ORD=["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th"];
var WORD=["first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth"];
var $=function(id){return document.getElementById(id)};

function speak(t){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---- Race ---- */
var cur=0;
function showBig(i,talk){
  cur=i;
  var b=$("big");
  b.innerHTML='<div class="pic">'+ANIMALS[i][0]+'</div><div class="num">'+ORD[i]+'</div><div class="word">'+WORD[i]+'</div><div class="sent">The '+ANIMALS[i][1]+' is '+WORD[i]+'.</div><button id="say" type="button">🔊 Listen</button>';
  b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
  $("say").onclick=function(){speak(WORD[i])};
  var rs=document.querySelectorAll(".runner");
  for(var k=0;k<rs.length;k++)rs[k].setAttribute("aria-pressed",k===i?"true":"false");
  if(talk)speak("The "+ANIMALS[i][1]+" is "+WORD[i]);
}
(function(){
  var t=$("track"),r=$("rows");
  ANIMALS.forEach(function(a,i){
    var bt=document.createElement("button");
    bt.type="button";bt.className="runner";
    bt.setAttribute("aria-label",ORD[i]+", "+a[1]);
    bt.innerHTML='<span class="a">'+a[0]+'</span><span class="o">'+ORD[i]+'</span>';
    bt.onclick=function(){showBig(i,true)};
    t.appendChild(bt);
    var d=document.createElement("div");
    d.innerHTML='<b>'+ORD[i]+'</b><span>'+WORD[i]+'</span>';
    r.appendChild(d);
  });
  showBig(0,false);
})();

/* ---- Quiz ---- */
var TOTAL=6,round=0,score=0,answer=0,tries=0,locked=false;
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

function nextQ(){
  if(round>=TOTAL){return endQ()}
  round++;tries=0;locked=false;
  $("round").textContent="Question "+round+" of "+TOTAL;
  $("pts").textContent="⭐ "+score;
  $("msg").textContent="";
  answer=rnd(10);
  var area=$("qarea");area.innerHTML="";
  var type=rnd(2);
  if(type===0){
    area.className="line";
    $("prompt").textContent="Tap the "+ORD[answer]+" animal.";
    ANIMALS.forEach(function(a,i){
      var b=document.createElement("button");b.type="button";b.className="opt";
      b.textContent=a[0];b.setAttribute("aria-label",a[1]);
      b.onclick=function(){check(b,i===answer)};
      area.appendChild(b);
    });
  }else{
    area.className="words";
    $("prompt").textContent="Which word means "+ORD[answer]+"?";
    var pool=[];for(var i=0;i<10;i++)if(i!==answer)pool.push(i);
    var ch=shuffle(pool).slice(0,2);ch.push(answer);shuffle(ch);
    ch.forEach(function(i){
      var b=document.createElement("button");b.type="button";b.className="opt";
      b.textContent=WORD[i];
      b.onclick=function(){check(b,i===answer)};
      area.appendChild(b);
    });
  }
}
function check(btn,ok){
  if(locked)return;
  if(ok){
    locked=true;
    btn.classList.add("ok");
    if(tries===0)score++;
    $("pts").textContent="⭐ "+score;
    $("msg").textContent="Great job! "+ORD[answer]+" = "+WORD[answer];
    speak(WORD[answer]);
    setTimeout(nextQ,1500);
  }else{
    tries++;
    btn.classList.add("no");btn.disabled=true;
    $("msg").textContent="Try again!";
  }
}
function endQ(){
  var stars=score>=5?3:score>=3?2:1;
  var s="";for(var i=0;i<3;i++)s+=i<stars?"⭐":"☆";
  $("round").textContent="Finished!";
  $("prompt").textContent="";
  $("msg").textContent="";
  $("qarea").className="";
  $("qarea").innerHTML='<div class="end"><div class="stars">'+s+'</div><p>You got '+score+' out of '+TOTAL+' on the first try.</p><button class="again" type="button" id="again">Play again</button></div>';
  $("again").onclick=function(){round=0;score=0;nextQ()};
}
nextQ();
</script>
</body>
</html>
